name: wheelgap
description: Fail CI when a Python dependency has no prebuilt wheel for the platforms you ship to.
author: patrickballard
branding:
  icon: package
  color: orange

inputs:
  args:
    description: >
      Arguments passed to wheelgap, e.g. "uv.lock -p 3.13 -t linux-aarch64,musl-x86_64".
      Pass -p explicitly: otherwise the runner's own Python version is assumed.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run wheelgap
      shell: bash
      env:
        WHEELGAP_ARGS: ${{ inputs.args }}
        FORCE_COLOR: "1"
      # WHEELGAP_ARGS is deliberately unquoted so it splits into separate arguments (and globs like
      # requirements/*.txt expand). It arrives through an env var, so it can't inject commands.
      run: pipx run --spec "$GITHUB_ACTION_PATH" wheelgap $WHEELGAP_ARGS
